name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Pytest (Home Assistant ${{ matrix.ha-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ha-version:
          - "2026.11.0"
          - "latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.2

      - name: Create virtual environment
        run: uv venv --python 3.14.2

      - name: Install test runner
        run: uv pip install --python .venv/bin/python pytest

      - name: Install Home Assistant version
        env:
          HA_VERSION: ${{ matrix.ha-version }}
        run: |
          if [ "$HA_VERSION" = "latest" ]; then
            uv pip install --python .venv/bin/python --reinstall --index-url https://pypi.org/simple homeassistant
          else
            uv pip install --python .venv/bin/python --reinstall --index-url https://pypi.org/simple "homeassistant==$HA_VERSION"
          fi
          uv pip install --python .venv/bin/python "pytest-homeassistant==$HA_VERSION"
          .venv/bin/python -c "import importlib.metadata; from packaging.version import Version; installed = importlib.metadata.version('homeassistant'); plugin = importlib.metadata.version('pytest-homeassistant'); print(f'Home Assistant installed: {installed}'); print(f'pytest-homeassistant installed: {plugin}'); assert Version(installed) == Version('$HA_VERSION'), 'Home Assistant and pytest-homeassistant versions must match'"

      - name: Run tests
        run: .venv/bin/python -m pytest -q
