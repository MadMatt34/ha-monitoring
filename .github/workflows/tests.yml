name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Pytest (Home Assistant ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha-version:
          - "2026.11.0"
          - "latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-homeassistant-custom-component

      - name: Install Home Assistant version
        env:
          HA_VERSION: ${{ matrix.ha-version }}
        run: |
          if [ "$HA_VERSION" = "latest" ]; then
            python -m pip install --upgrade --force-reinstall --index-url https://pypi.org/simple homeassistant
          else
            python -m pip install --force-reinstall --index-url https://pypi.org/simple "homeassistant==$HA_VERSION"
          fi
          python -c "import importlib.metadata; from packaging.version import Version; installed = importlib.metadata.version('homeassistant'); print(f'Home Assistant installed: {installed}'); assert Version(installed) >= Version('2026.11.0'), 'Installed Home Assistant is older than the supported minimum 2026.11.0'"

      - name: Run tests
        run: python -m pytest -q
