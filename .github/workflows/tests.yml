name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Pytest (Home Assistant ${{ matrix.ha-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ha-version:
          - "2026.11.0"
          - "latest"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14.2

      - name: Create virtual environment
        run: uv venv --python 3.14.2

      - name: Install test dependencies
        run: |
          uv pip install --python .venv/bin/python pytest pytest-homeassistant-custom-component

      - name: Install Home Assistant version
        env:
          HA_VERSION: ${{ matrix.ha-version }}
        run: |
          if [ "$HA_VERSION" = "latest" ]; then
            uv pip install --python .venv/bin/python --reinstall --index-url https://pypi.org/simple homeassistant
          else
            uv pip install --python .venv/bin/python --reinstall --index-url https://pypi.org/simple "homeassistant==$HA_VERSION"
          fi
          .venv/bin/python -c "import importlib.metadata; from packaging.version import Version; installed = importlib.metadata.version('homeassistant'); print(f'Home Assistant installed: {installed}'); assert Version(installed) >= Version('2026.11.0'), 'Installed Home Assistant is older than the supported minimum 2026.11.0'"

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          .venv/bin/python -c
          "import homeassistant; import pytest; raise SystemExit(pytest.main(['-p', 'pytest_homeassistant_custom_component.plugins', '-p', 'pytest_asyncio.plugin', '-q']))"
