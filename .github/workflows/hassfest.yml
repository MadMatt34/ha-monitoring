name: Hassfest Check

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'README.fr.md'
      - '_WIP/**'
      - '.github/workflows/**'
      - '.gitignore'
      - 'ha-monitoring/custom_components/ha_monitoring/brand/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'README.fr.md'
      - '_WIP/**'
      - '.github/workflows/**'
      - '.gitignore'
      - 'ha-monitoring/custom_components/ha_monitoring/brand/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
